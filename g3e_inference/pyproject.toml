[project]
name = "g3e-inference"
version = "0.1.0"
description = "Production inference pipeline for G3E-1 (YOLO detection) + G3E-2 (Qwen2.5-VL LoRA semantic reasoning)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Godsave Ogbidor Kawurem" }]
dependencies = [
    "pydantic>=2.6",
    "pillow>=10.2",
    "opencv-python-headless>=4.9",
    "huggingface_hub>=0.22",
    "ultralytics>=8.2",
    "torch>=2.2",
    "transformers>=4.46",
    "accelerate>=0.34",
    "peft>=0.13",
    "qwen-vl-utils>=0.0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
g3e-predict = "g3e_inference.cli:predict_main"
g3e-download = "g3e_inference.cli:download_main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["g3e_inference*"]
